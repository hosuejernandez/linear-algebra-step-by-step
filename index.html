<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Explainer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="matrix.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #5f6670;
    --border: #dcdfe3;
    --accent: #2f6fdf;
    --accent-soft: #e8f0fd;
    --error-bg: #fdecec;
    --error-text: #a12626;
    --yes: #1e8a4c;
    --no: #b5473c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card: #1c1f24;
      --text: #e8eaed;
      --muted: #a0a6ae;
      --border: #33373e;
      --accent: #7aa7f5;
      --accent-soft: #1f2a3d;
      --error-bg: #3a1d1d;
      --error-text: #f5a3a3;
      --yes: #5fcf8e;
      --no: #e8877d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 0.9em;
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* --- input --- */
  .sizes { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper span.label { font-weight: 600; min-width: 70px; }
  .stepper button {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
  }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper output { min-width: 20px; text-align: center; font-weight: 600; font-size: 1.1rem; }

  .matrix-wrap { overflow-x: auto; padding: 4px 0 8px; }
  .matrix {
    display: inline-grid;
    gap: 8px;
    padding: 10px 16px;
    position: relative;
  }
  /* big square brackets around the boxes */
  .matrix::before, .matrix::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 10px;
    border: 2.5px solid var(--text);
  }
  .matrix::before { left: 0; border-right: none; }
  .matrix::after { right: 0; border-left: none; }
  .matrix input {
    width: 64px;
    height: 40px;
    text-align: center;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  .matrix input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .matrix input.bad { border-color: var(--error-text); background: var(--error-bg); }
  @media (max-width: 480px) {
    .card { padding: 16px; }
    .matrix { gap: 6px; padding: 8px 14px; }
    .matrix input { width: 48px; }
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .options input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  .mod-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .mod-n { color: var(--muted); }
  .mod-n input {
    width: 90px;
    height: 34px;
    text-align: center;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  .mod-n input:disabled { opacity: 0.45; }
  .mod-n input.bad { border-color: var(--error-text); background: var(--error-bg); }

  /* "At a glance": one tile per fact. Add a tile for anything new (e.g. eigenvalues). */
  .summary { margin-top: 12px; }
  .summary .label { color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .tile {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    background: var(--bg);
  }
  .tile .name { color: var(--muted); font-size: 0.85rem; }
  .tile .value { font-size: 1.1rem; font-weight: 600; }
  .tile.wide { grid-column: 1 / -1; }
  .tile .yes { color: var(--yes); }
  .tile .no { color: var(--no); }

  .stepper button:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .errors {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 16px;
  }
  .errors ul { margin: 6px 0 0; padding-left: 20px; }

  /* --- output --- */
  .section-tools {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    color: var(--muted);
    margin: 4px 4px 8px;
  }
  .section-tools button {
    border: none;
    background: none;
    padding: 0;
    color: var(--accent);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .section-tools button:hover { text-decoration: underline; }

  details.section { padding: 0; margin-bottom: 10px; }
  details.section > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    cursor: pointer;
    list-style: none;
    border-radius: 12px;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before {
    content: "▸";
    color: var(--muted);
    transition: transform 0.15s;
  }
  details.section[open] > summary::before { transform: rotate(90deg); }
  details.section > summary:hover { background: var(--accent-soft); }
  details.section > summary:focus-visible { outline: 2px solid var(--accent); }
  details.section .body { padding: 0 20px 16px; }
  .section h2 { font-size: 1.2rem; margin: 0; }
  .section h2 .num { color: var(--accent); margin-right: 6px; }
  .section p { margin: 10px 0; }
  .formula { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .katex-display { margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>Matrix Explainer</h1>
  <p class="lead">Type in a matrix and see its kernel, image, eigenvalues, and whether it is
    injective, surjective, and invertible, with every step explained. Entries can be whole numbers,
    decimals, or fractions like <code>-3/4</code>.</p>

  <div class="card">
    <div class="sizes">
      <div class="stepper">
        <span class="label">Rows</span>
        <button type="button" data-size="rows" data-step="-1" aria-label="Fewer rows">−</button>
        <output id="rows-value"></output>
        <button type="button" data-size="rows" data-step="1" aria-label="More rows">+</button>
      </div>
      <div class="stepper">
        <span class="label">Columns</span>
        <button type="button" data-size="cols" data-step="-1" aria-label="Fewer columns">−</button>
        <output id="cols-value"></output>
        <button type="button" data-size="cols" data-step="1" aria-label="More columns">+</button>
      </div>
    </div>
    <div class="matrix-wrap"><div class="matrix" id="matrix"></div></div>
    <div class="summary" id="summary"></div>
    <div class="options">
      <div class="mod-row">
        <label><input type="checkbox" id="mod-on"> Work in ℤ mod n</label>
        <label class="mod-n">n = <input id="mod-n" value="7" inputmode="numeric"
          autocomplete="off" aria-label="n, the modulus" disabled></label>
      </div>
      <label><input type="checkbox" id="show-steps"> Would you like to see the steps for RREF?</label>
    </div>
    <div class="errors" id="errors" hidden></div>
  </div>

  <div class="section-tools">
    <button type="button" data-open-all="true">Open all</button>
    <span aria-hidden="true">·</span>
    <button type="button" data-open-all="false">Close all</button>
  </div>
  <div id="results"></div>
</main>

<script>
  const MAX_SIZE = 6;

  // What the user has typed, one string per box. It starts with a sample matrix.
  let grid = [["1", "2", "0", "3"], ["2", "4", "1", "7"], ["3", "6", "1", "10"]];

  const matrixBox = document.getElementById("matrix");
  const errorsBox = document.getElementById("errors");
  const summaryBox = document.getElementById("summary");
  const resultsBox = document.getElementById("results");

  // ---------------------------------------------------------------------
  // The input boxes
  // ---------------------------------------------------------------------

  function drawGrid() {
    const rows = grid.length;
    const cols = grid[0].length;
    matrixBox.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    matrixBox.innerHTML = "";
    grid.forEach((row, i) =>
      row.forEach((value, j) => {
        const box = document.createElement("input");
        box.value = value;
        box.inputMode = "text";
        box.autocomplete = "off";
        box.spellcheck = false;
        box.setAttribute("aria-label", `Row ${i + 1}, Column ${j + 1}`);
        box.addEventListener("input", () => {
          grid[i][j] = box.value;
          scheduleUpdate();
        });
        box.addEventListener("focus", () => box.select());
        matrixBox.appendChild(box);
      })
    );
    document.getElementById("rows-value").textContent = rows;
    document.getElementById("cols-value").textContent = cols;
    document.querySelectorAll("[data-size]").forEach((button) => {
      const current = button.dataset.size === "rows" ? rows : cols;
      const next = current + Number(button.dataset.step);
      button.disabled = next < 1 || next > MAX_SIZE;
    });
  }

  // Keep what was typed; new boxes start at 0.
  function resize(rows, cols) {
    grid = Array.from({ length: rows }, (_, i) =>
      Array.from({ length: cols }, (_, j) => grid[i]?.[j] ?? "0"));
    drawGrid();
    update();
  }

  document.querySelectorAll("[data-size]").forEach((button) =>
    button.addEventListener("click", () => {
      const step = Number(button.dataset.step);
      const rows = grid.length + (button.dataset.size === "rows" ? step : 0);
      const cols = grid[0].length + (button.dataset.size === "cols" ? step : 0);
      resize(rows, cols);
    })
  );

  // ---------------------------------------------------------------------
  // Showing the explanation
  // ---------------------------------------------------------------------

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Plain text with **bold**, *italic*, `code`.
  function formatText(text) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  function math(tex, displayMode) {
    return katex.renderToString(tex, { displayMode, throwOnError: false });
  }

  // A sentence where $...$ is inline math. Math is pulled out first so the
  // bold/italic markers can wrap around it.
  function renderSentence(text) {
    const formulas = [];
    const withSlots = text.replace(/\$([^$]+)\$/g, (_, tex) => {
      formulas.push(math(tex, false));
      return `\u0000${formulas.length - 1}\u0000`;
    });
    return formatText(withSlots).replace(/\u0000(\d+)\u0000/g, (_, k) => formulas[k]);
  }

  function showErrors(errors) {
    errorsBox.hidden = !errors.length;
    errorsBox.innerHTML = errors.length
      ? `Let's fix ${errors.length === 1 ? "this" : "these"} first:<ul>` +
        errors.map((e) => `<li>${renderSentence(e)}</li>`).join("") + "</ul>"
      : "";
    const bad = new Set(errors
      .map((e) => e.match(/^Row (\d+), Column (\d+)/))
      .filter(Boolean)
      .map((found) => found.slice(1).join(",")));
    matrixBox.querySelectorAll("input").forEach((box, k) => {
      const cols = grid[0].length;
      box.classList.toggle("bad", bad.has(`${Math.floor(k / cols) + 1},${(k % cols) + 1}`));
    });
  }

  // ---------------------------------------------------------------------
  // Options: ℤ mod n and RREF steps
  // ---------------------------------------------------------------------

  const modOn = document.getElementById("mod-on");
  const modN = document.getElementById("mod-n");
  const showSteps = document.getElementById("show-steps");

  modOn.addEventListener("change", () => {
    modN.disabled = !modOn.checked;
    update();
  });
  modN.addEventListener("input", scheduleUpdate);
  modN.addEventListener("focus", () => modN.select());
  showSteps.addEventListener("change", update);

  // The "At a glance" tiles. Each tile is [name, value as HTML, extra class].
  function showSummary(a) {
    const check = (name, ok) =>
      [name, ok ? '<span class="yes">✓ Yes</span>' : '<span class="no">✗ No</span>', ""];
    const tiles = [
      check("Injective", a.injective),
      check("Surjective", a.surjective),
      check("Invertible", a.invertible),
      ["Rank", String(a.rank), ""],
      ["Nullity", String(a.nullity), ""],
    ];
    if (a.det !== null) {
      const mod = a.modulus === null ? "" : String.raw`\pmod{${a.modulus}}`;
      tiles.push(["Determinant", math(a.det.tex() + mod, false), ""]);
    }
    const eigenvalues = MatrixMath.eigenSummary(a);
    if (eigenvalues !== null) tiles.push(["Eigenvalues", math(eigenvalues, false), "wide"]);
    summaryBox.innerHTML =
      '<div class="label">At a glance:</div><div class="tiles">' +
      tiles.map(([name, value, extra]) =>
        `<div class="tile ${extra}"><div class="name">${name}</div>` +
        `<div class="value">${value}</div></div>`).join("") +
      "</div>";
  }

  // ---------------------------------------------------------------------
  // Dropdown sections: remember which ones are open while the page redraws
  // ---------------------------------------------------------------------

  const openSections = new Set(["The Setup", "Row Reduce to RREF"]);

  // "toggle" doesn't bubble, so listen while it travels down (capture).
  resultsBox.addEventListener("toggle", (event) => {
    const title = event.target.dataset.title;
    if (event.target.open) openSections.add(title);
    else openSections.delete(title);
  }, true);

  document.querySelectorAll("[data-open-all]").forEach((button) =>
    button.addEventListener("click", () => {
      const open = button.dataset.openAll === "true";
      resultsBox.querySelectorAll("details").forEach((section) => { section.open = open; });
    })
  );

  function update() {
    // null means the normal mode (exact fractions).
    let modulus = null;
    let modError = null;
    if (modOn.checked) {
      ({ modulus = null, error: modError = null } = MatrixMath.parseModulus(modN.value));
    }
    modN.classList.toggle("bad", Boolean(modError));

    const { matrix, errors } = MatrixMath.parseGrid(grid, modulus);
    showErrors(modError ? [modError, ...errors] : errors);
    // Keep the last good explanation on screen (faded) while something is being fixed.
    const ready = matrix && !modError;
    resultsBox.style.opacity = summaryBox.style.opacity = ready ? 1 : 0.35;
    if (!ready) return;
    const analysis = MatrixMath.analyze(matrix, modulus);
    showSummary(analysis);
    const sections = MatrixMath.explain(analysis, { showSteps: showSteps.checked });
    resultsBox.innerHTML = sections
      .map(([title, blocks], k) =>
        `<details class="card section" data-title="${title}"${openSections.has(title) ? " open" : ""}>` +
        `<summary><h2><span class="num">${k + 1}.</span>${title}</h2></summary><div class="body">` +
        blocks
          .map(([kind, content]) =>
            kind === "latex"
              ? `<div class="formula">${math(content, true)}</div>`
              : `<p>${renderSentence(content)}</p>`)
          .join("") +
        "</div></details>")
      .join("");
  }

  let timer;
  function scheduleUpdate() {
    clearTimeout(timer);
    timer = setTimeout(update, 200);
  }

  drawGrid();
  update();
</script>
</body>
</html>
